{% extends "base.html" %}

{% block title %}Confirm Deletion — EduFlow{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4 text-center">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle fs-1"></i>
            </div>
            <h4 class="fw-bold mb-2">Delete FeeStructures Record?</h4>
            <p class="text-muted mb-4">Are you sure you want to delete <strong>{{ object.name }}</strong> ({{ object.code }})? This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'fees:feestructures_list' %}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
